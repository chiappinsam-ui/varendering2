<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VA Rendering | Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ====================================================================================================
           1. CORE SETTINGS (NO SCROLLING DOWN)
           ==================================================================================================== */
        :root {
            --primary-orange: #FF5722;
            --bg-deep: #050505;
            --header-height: 90px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            /* Hide ALL scrollbars */
            scrollbar-width: none; 
        }
        *::-webkit-scrollbar { display: none; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background-color: var(--bg-deep);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at 50% 50%, #1a0d0b 0%, #000000 100%);
            
            /* CRITICAL: This locks the screen. You cannot scroll down. */
            overflow: hidden; 
            position: fixed; 
            inset: 0;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }
        img, video { display: block; width: 100%; height: 100%; object-fit: cover; }

        /* ====================================================================================================
           2. NAVIGATION
           ==================================================================================================== */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height); z-index: 1000;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .container-nav { width: 100%; max-width: 1800px; margin: 0 auto; height: 100%; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; }
        
        .logo a { font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #fff; display: flex; align-items: center; gap: 15px; }
        .logo .va { color: var(--primary-orange); }
        .nav-logo { height: 35px; width: auto; margin-right: 12px; filter: invert(1) hue-rotate(180deg) brightness(1.2); mix-blend-mode: screen; }

        nav { display: flex; align-items: center; }
        nav ul { display: flex; gap: 40px; }
        nav ul li a { font-weight: 700; text-transform: uppercase; font-size: 0.8rem; color: #aaa; padding: 10px 0; }
        nav ul li a:hover, nav ul li a.active { color: #fff; }

        .mobile-nav-toggle { display: none; width: 30px; height: 20px; cursor: pointer; z-index: 2000; }
        .mobile-nav-toggle span { display: block; width: 100%; height: 2px; background: #fff; margin-bottom: 6px; transition: 0.3s; }

        /* ====================================================================================================
           3. HORIZONTAL GALLERY ENGINE
           ==================================================================================================== */
        .gallery-viewport {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            display: flex;
            align-items: center; /* Centers cards vertically */
        }

        .gallery-track {
            display: flex;
            gap: 40px;
            padding-left: 10vw;
            padding-right: 10vw;
            will-change: transform;
        }

        .gallery-card {
            position: relative;
            /* Fixed sizes */
            width: 50vh; 
            height: 70vh;
            flex-shrink: 0;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease, border-color 0.3s;
        }

        .gallery-card:hover {
            transform: scale(1.02);
            border-color: var(--primary-orange);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        /* Number Tag */
        .card-num {
            position: absolute; top: 20px; right: 20px;
            font-size: 4rem; font-weight: 900; color: rgba(255,255,255,0.1);
            line-height: 1; z-index: 2; pointer-events: none;
        }

        /* ====================================================================================================
           4. FOOTER HINT (FIXED BOTTOM)
           ==================================================================================================== */
        .scroll-footer {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 100; pointer-events: none;
            text-align: center;
        }
        
        .scroll-text {
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; color: #666;
            margin-bottom: 10px; display: block;
        }

        .scroll-line {
            width: 1px; height: 40px; background: rgba(255,255,255,0.1); margin: 0 auto; position: relative; overflow: hidden;
        }
        .scroll-line::after {
            content: ''; position: absolute; inset: 0; background: var(--primary-orange);
            animation: drop 1.5s infinite;
        }
        @keyframes drop { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }

        /* ====================================================================================================
           5. MOBILE OPTIMIZATION
           ==================================================================================================== */
        @media (max-width: 992px) {
            .navbar { justify-content: space-between; padding: 0 20px; }
            
            nav { 
                position: fixed; top: 0; right: -100%; width: 100%; height: 100vh;
                background: #000; flex-direction: column; justify-content: center;
                transition: 0.3s; z-index: 1500;
            }
            body.nav-open nav { right: 0; }
            nav ul { flex-direction: column; gap: 30px; }
            
            .mobile-nav-toggle { display: block; }

            /* On Mobile, allow native horizontal scroll */
            .gallery-viewport { 
                position: absolute; inset: 0;
                overflow-x: scroll; overflow-y: hidden;
                -webkit-overflow-scrolling: touch; 
                align-items: center;
            }
            .gallery-track {
                padding: 0 30px;
                height: 60vh;
                display: flex; align-items: center;
            }
            .gallery-card {
                width: 80vw; height: 100%; margin-right: 20px;
            }
            .scroll-footer { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container-nav">
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="Logo" class="nav-logo" onerror="this.style.display='none'">
                    <span><span style="color:#FF5722">VA</span>Rendering</span>
                </a>
            </div>
            
            <nav id="nav-menu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="Gallary.html" class="active">Gallery</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>

            <div class="mobile-nav-toggle" id="nav-toggle">
                <span></span><span></span><span></span>
            </div>
        </div>
    </header>

    <div class="gallery-viewport">
        <div class="gallery-track" id="track">
            
            <div class="gallery-card">
                <div class="card-num">01</div>
                <img src="images/vinny1.png" alt="Project 1">
            </div>

            <div class="gallery-card">
                <div class="card-num">02</div>
                <video src="images/vinny12.MOV" autoplay loop muted playsinline>
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="gallery-card">
                <div class="card-num">03</div>
                <img src="images/vinny2.png" alt="Project 2">
            </div>

            <div class="gallery-card">
                <div class="card-num">04</div>
                <img src="images/vinny3.png" alt="Project 3">
            </div>

            <div class="gallery-card">
                <div class="card-num">05</div>
                <img src="images/vinny4.png" alt="Project 4">
            </div>

            <div class="gallery-card">
                <div class="card-num">06</div>
                <img src="images/vinny5.png" alt="Project 5">
            </div>

            <div class="gallery-card">
                <div class="card-num">07</div>
                <img src="images/vinny6.png" alt="Project 6">
            </div>

            <div class="gallery-card">
                <div class="card-num">08</div>
                <img src="images/vinny7.png" alt="Project 7">
            </div>

        </div>
    </div>

    <div class="scroll-footer">
        <span class="scroll-text">Scroll / Drag</span>
        <div class="scroll-line"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- HORIZONTAL SCROLL ENGINE (DESKTOP) ---
            if (window.innerWidth > 992) {
                const track = document.getElementById('track');
                let currentScroll = 0;
                let targetScroll = 0;
                // Calculate total width - viewport width + padding
                const maxScroll = () => track.scrollWidth - window.innerWidth + 200;

                window.addEventListener('wheel', (e) => {
                    // This converts VERTICAL scroll (wheel) into HORIZONTAL movement
                    targetScroll += e.deltaY;
                    targetScroll = Math.max(0, targetScroll);
                    targetScroll = Math.min(maxScroll(), targetScroll);
                });

                function animate() {
                    currentScroll += (targetScroll - currentScroll) * 0.08;
                    track.style.transform = `translateX(-${currentScroll}px)`;
                    requestAnimationFrame(animate);
                }
                animate();
            }

            // --- MOBILE MENU ---
            const navToggle = document.getElementById('nav-toggle');
            if(navToggle) {
                navToggle.addEventListener('click', () => {
                    document.body.classList.toggle('nav-open');
                });
            }

            const galleryVideo = document.querySelector('.gallery-card:nth-child(2) video');
            if (galleryVideo) {
                console.log('Gallery video source:', galleryVideo.currentSrc || galleryVideo.getAttribute('src') || '(empty)');
            }
        });
    </script>
</body>
</html>
